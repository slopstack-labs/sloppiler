name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0-agentic-alignment)'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o sloppiler-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sloppiler-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sloppiler-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          gh api repos/${{ github.repository }}/git/refs \
            -f ref="refs/tags/${{ github.event.inputs.version }}" \
            -f sha="${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: sloppiler-*
          body: |
            ## Sloppiler ${{ github.event.inputs.version || github.ref_name }}

            *Beyond Deterministic Compilation.*

            Download the binary for your platform and point it at a running Ollama instance.
            Sloppiler now targets your host OS and architecture by default — pass `--target` and `--arch` to materialize something else. Whether the result runs is still not a bug.

            | Platform | Binary |
            |----------|--------|
            | Linux x86_64 | `sloppiler-linux-amd64` |
            | macOS Intel | `sloppiler-darwin-amd64` |
            | macOS Apple Silicon | `sloppiler-darwin-arm64` |
            | Windows x86_64 | `sloppiler-windows-amd64.exe` |
